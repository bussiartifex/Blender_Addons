name: Bug report
description: Something doesn't work as expected
labels: ["bug"]
body:
  - type: dropdown
    id: addon
    attributes:
      label: Add-on
      options:
        - Vertical Timeline
        - Node Dock
        - Physically Based
        - Phone Gyro
        - DualSense Controller
    validations:
      required: true
  - type: input
    id: addon_version
    attributes:
      label: Add-on version
      description: Shown in Preferences > Add-ons
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: blender_version
    attributes:
      label: Blender version and operating system
      placeholder: "Blender 4.5, Windows 11"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
  - type: textarea
    id: log
    attributes:
      label: Error text
      description: Copy it from Window > Toggle System Console (Windows), or the terminal you started Blender from
      render: text
